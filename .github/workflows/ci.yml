name: CI

on:
  push:
  pull_request:

jobs:
  internationalization:
    name: Internationalization
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: wp-cli
          coverage: none

      - name: Audit and extract translation strings
        run: bash scripts/check-i18n.sh

  javascript:
    name: Admin JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check syntax and behavior
        run: |
          node --check assets/admin.js
          node tests/admin-js.js

  browser-conversion-bundle:
    name: Browser conversion bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Type check and rebuild the WebAssembly module
        working-directory: wasm
        run: |
          npm ci
          npm run build

      # The committed bundle must match the committed sources, so a rebuild is
      # compared with the files the plugin actually loads at runtime.
      - name: Compare the shipped bundle with a clean build
        run: |
          diff wasm/dist/safewebp-browser.js assets/wasm/safewebp-browser.js
          diff -r wasm/dist/assets assets/wasm/assets
          node --input-type=module --check < assets/wasm/safewebp-browser.js
          test -z "$(find assets/wasm -name '.*' -print -quit)"

      - name: Confirm the shipped licences cover the bundled codec
        run: |
          grep -qF 'Google Inc' assets/wasm/THIRD-PARTY-NOTICES/libwebp-LICENSE.md
          grep -qF 'AOMediaCodec/libavif' assets/wasm/THIRD-PARTY-NOTICES/libavif-LICENSE.txt
          grep -qF 'Alliance for Open Media' assets/wasm/THIRD-PARTY-NOTICES/libaom-LICENSE.txt
          grep -qF 'jamsinclair' assets/wasm/THIRD-PARTY-NOTICES/jsquash-LICENSE.txt
          grep -qF 'Apache License' assets/wasm/THIRD-PARTY-NOTICES/wasm-feature-detect-LICENSE.txt

  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: |
          # The plugin itself supports PHP 7.4+.
          find . -name '*.php' -not -path './includes/picowebp/*' -print0 | xargs -0 -n1 php -l
          # The bundled picowebp encoder needs PHP 8.1, so it is only linted on
          # runtimes that can actually parse it.
          if php -r 'exit(version_compare(PHP_VERSION, "8.1.0", ">=") ? 0 : 1);'; then
            find ./includes/picowebp -name '*.php' -print0 | xargs -0 -n1 php -l
          fi

  pure-php-encoder:
    name: Pure-PHP encoder (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.4'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Run the pure-PHP encoder checks
        run: php tests/php-encoder.php

  avif-container:
    name: AVIF container validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Run the AVIF container checks
        run: php tests/avif-container.php

  wordpress-activation:
    name: WordPress activation (WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }}, ${{ matrix.image_stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.0'
            extensions: gd, mysqli
            image_stack: gd
            expected_editor: GD
          - php: '8.3'
            wordpress: '7.1.1'
            extensions: gd, mysqli
            image_stack: gd
            expected_editor: GD
          - php: '8.4'
            wordpress: '7.1.1'
            extensions: gd, mysqli
            image_stack: gd
            expected_editor: GD
          - php: '8.3'
            wordpress: '7.1.1'
            extensions: gd, imagick, mysqli
            image_stack: imagick
            expected_editor: Imagick
          - php: '8.4'
            wordpress: '7.1.1'
            extensions: gd, imagick, mysqli
            image_stack: imagick
            expected_editor: Imagick

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          tools: wp-cli
          coverage: none

      - name: Install WordPress
        run: |
          wp core download --version="${{ matrix.wordpress }}" --path=/tmp/wp
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --path=/tmp/wp
          wp core install --url=http://example.test --title=Test --admin_user=admin --admin_password=password --admin_email=admin@example.test --path=/tmp/wp

      - name: Install exact release ZIP
        run: |
          release_zip="$(bash scripts/build-wordpress-org-dist.sh | sed -n '1p')"
          unzip -q "${release_zip}" -d /tmp/wp/wp-content/plugins

      - name: Activate plugin
        run: wp plugin activate indexlane-safe-webp-queue --path=/tmp/wp

      - name: Run conversion smoke test
        run: php tests/smoke-wordpress.php /tmp/wp
        env:
          ILSWQ_SMOKE_EDITOR: ${{ matrix.expected_editor }}

      - name: Run browser conversion backend test
        run: php tests/browser-wordpress.php /tmp/wp

      - name: Run Media Review integration test
        run: php tests/ai-wordpress.php /tmp/wp

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract the unmodified final ZIP
        run: |
          release_zip="$(bash scripts/build-wordpress-org-dist.sh | sed -n '1p')"
          mkdir -p /tmp/plugin-check
          unzip -q "${release_zip}" -d /tmp/plugin-check

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: /tmp/plugin-check/indexlane-safe-webp-queue
          # First-party code keeps its PHP 7.4 baseline. The optional, guarded
          # upstream encoder has dedicated runtime and lint checks above.
          exclude-directories: includes/picowebp
